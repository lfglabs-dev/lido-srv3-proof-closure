      "accepted": true,
      "risk": "SHA-256 precompile behavior relies on opaque native FFI and host-library behavior; differential vectors do not close this crypto risk.",
      "justification": "The project proves SSZ preimage shape but does not re-prove SHA-256/precompile functional correctness.",
      "severity": "HIGH",
      "violation_impact": "Digest-value and proof-verification claims fail if SHA-256 behavior differs.",
      "validation": "Pin the FFI/precompile interface and run known-answer vectors; do not promote vectors to a cryptographic proof.",
      "removal_path": "Prove or import a separately certified SHA-256/precompile refinement theorem."

    {
      "id": "A-RUNTIME-PROVENANCE",
      "accepted": true,
      "risk": "Canonical runtime, codehash, fork configuration, and address provenance are unavailable in general; Mock-derived evidence is non-production evidence. Chantier 4 (Thomas 2026-09-13) narrows this for two deployed-runtime fixtures under `fixtures/deployed/` to exact identifiers: `WithdrawalVault_implementation` at `0xfB4521BD151BFB45DB6045D2d07e58e0f597e340` with EIP-1052 codehash `0xd1e0d1b48e4f5abd04bdfd14805366f0cf7946b7bb41b7a5ad8652361f3e3d36` (mainnet, block-independent at any block where the immutable code has not been upgraded — the implementation slot on the WithdrawalVault_proxy `0xB9D7934878B5FB9610B3fE8A5e441e8fad7E293f` points at this deployed runtime, and the runtime is not upgradeable); `StakingRouter_implementation` at `0xDD76927045435C7605cf6f5F978cfb8CABDb5F80` with codehash `0x9cd5d45ddde5f74d3867aa22c98fd79a85df89d202145bc588173d92e00600ec` (same block-independence rationale). Under `ETH_RPC_URL`, the `verify_*_immutable.py` scripts re-fetch and re-verify against the live chain, so a mismatch fails the build; without `ETH_RPC_URL`, they enforce the pinned codehash. Step 1c (Thomas 2026-09-17) extends the fixtures to `fixtures/deployed/srv3-identities.json`, recording by EIP-1052 codehash the SRLib library linked into the router (`0xc0be9942fd8f54ab126a5f0ba649a90049ccad14`) with its 21 PUSH20 link sites, the BeaconChainDepositor library (`0xf98ac162eab766bdb9507c3584c00c535b8f6216`, 3 sites), the MinFirstAllocationStrategy library linked into SRLib (`0x98f1da239a199574a4f7f371fd8fc0a872022c73`, 1 site), the implementations behind the four registered staking modules (NodeOperatorsRegistry/SimpleDVT `0x6828b023e737f96b168acd0b5c6351971a4f81ae`, CSModule `0x63992a86f009fcc796a8369feefb68880aef4e3a`, CuratedModuleV2 `0x959fc67fe53c8a6c7a1aed73430aa07a36ed9337`), the LidoLocator implementation (`0xf2ffb952e129a63f0614ff87126e1d4a494a2313`) and its withdrawalQueue/accountingOracle implementations (`0xe42c659dc09109566720ea8b2de186c2be7d94d9`, `0xe4f03d1107d1905b6f2a28fcb6af221e0ce19136`) and the AccountingOracle HashConsensus (`0xd624b08c83baecf0807dd2c6880c3154a5f0b288`); `scripts/verify_srv3_identities.py` enforces the fixture hashes and link-map offsets and, under `ETH_RPC_URL`, re-reads the proxies, `getStakingModules()`, the locator getters and the live code. For every other contract or configuration under this assumption, the generic reduction stands.",
      "justification": "This premise isolates an unproved environment or representation fact instead of hiding it in the theorem. Chantier 4 (Thomas 2026-09-13) narrows this for the two deployed-runtime fixtures under `fixtures/deployed/` by recording their exact EIP-1052 EXTCODEHASH (keccak256 of the runtime bytecode) in `audit/artifacts.lock.json`: `WithdrawalVault_implementation` (0xfB4521BD151BFB45DB6045D2d07e58e0f597e340) codehash = 0xd1e0d1b48e4f5abd04bdfd14805366f0cf7946b7bb41b7a5ad8652361f3e3d36, `StakingRouter_implementation` (0xDD76927045435C7605cf6f5F978cfb8CABDb5F80) codehash = 0x9cd5d45ddde5f74d3867aa22c98fd79a85df89d202145bc588173d92e00600ec. That is the exact identifier `EXTCODEHASH <implementation>` on any Ethereum node returns for either implementation at any block where the code has not been upgraded. The `verify_*_immutable.py` scripts (invoked from `make test`) recompute keccak256 of the fixture and reject any mismatch; under `ETH_RPC_URL` they also refetch and re-verify against the live chain.",
      "severity": "MEDIUM",
      "scope": "global",
      "violation_impact": "Any guarantee linked to this premise must be re-evaluated if the premise is false.",
      "validation": "Applies to every guarantee. scripts/check_deployed_code.py reads each proxy implementation slot, hashes the on-chain bytecode and compares the verified source with the pinned lido-core checkout; PROVENANCE.md explains the procedure. Chantier 4 additions: for the two deployed-runtime fixtures the exact EIP-1052 codehash is recorded (see `justification`) and enforced by `scripts/verify_beacon_deposit_immutable.py`, `scripts/verify_consolidation_request_immutable.py`, and `scripts/verify_deposit_thirty_two_ether.py` (all three are `make test` targets). A mismatch between the recomputed keccak256 and the recorded codehash fails the build; `ETH_RPC_URL` enables live re-verification against the current chain state.",
      "removal_path": "Replace the premise with a machine-checked correspondence theorem or a narrower proved interface. Chantier 4 (Thomas 2026-09-13) narrows the runtime-identity strand for two deployed fixtures to the exact EIP-1052 codehash values above; step 1c (Thomas 2026-09-17) adds the SRLib/BeaconChainDepositor/MinFirstAllocationStrategy link map, the registered module implementations and the locator/queue/oracle/consensus identities by codehash (`fixtures/deployed/srv3-identities.json`); historical block-number binding, constructor configuration and the remaining contracts remain follow-up work."
    },
    {
      "id": "A-SOLC-TRUSTED",
      "accepted": true,
      "risk": "Applies to every guarantee: pinned solc compilation is trusted when producing bytecode; the project does not prove solc correct.",
      "justification": "General Yul/EVM correspondence is outside the assurance objective; a pinned compiler is an explicit engineering boundary.",
      "severity": "MEDIUM",
      "scope": "global",
      "violation_impact": "A solc miscompilation could break properties of the generated artifact despite correct Lean/Verity proofs.",
      "validation": "Pin the solc version/profile and retain reproducible artifact hashes when bytecode is produced.",
      "removal_path": "Adopt a separately verified compiler refinement; not required by the current project objective."
    },
    {
      "id": "A-CLASSICAL-CHOICE",
      "accepted": true,
      "risk": "Proofs may depend on the classical axiom Classical.choice in addition to propext and Quot.sound; the development is therefore not constructive.",
      "justification": "Classical.choice is a standard Lean 4 / Mathlib foundational axiom, discharged by the kernel rather than by project-level trust. It is accepted as the third allowed axiom alongside propext and Quot.sound so that the axiom gate can distinguish it from genuine proof escapes such as sorryAx, Lean.ofReduceBool, or project-introduced axioms.",
      "severity": "LOW",
      "violation_impact": "Only a foundational inconsistency in Lean's classical axioms would invalidate the affected theorems; no project-specific claim rests on it.",
      "validation": "LidoSRv3.Audit.Trust prints the axiom dependencies of every registered theorem, so any dependency outside {propext, Classical.choice, Quot.sound} is visible in the build log.",
      "removal_path": "Re-prove the affected theorems constructively; not required, since classical reasoning is in scope for this development."
    },
    {
      "id": "A-SHA256-FFI",
      "accepted": true,
      "risk": "SHA-256 precompile behavior relies on opaque native FFI and host-library behavior; the audit does not prove SHA-256/precompile functional correctness. The isolation attempted by PR #400 (`SszSha256Isolation.lean`) is UNSOUND per the corrected mandate 2026-09-12 rule: `sha256` is an opaque definition in `Compiler.Sha256.Engine` \u2014 embedding an assumption in a type/definition means the assumption is still consumed, even though `#print axioms` reports only foundational axioms. This entry is reinstated in every SSZ consumer's list and the isolation is documented as reclassing, not discharging.",
      "justification": "The project proves SSZ preimage shape but does not re-prove SHA-256/precompile functional correctness. Every registered SSZ theorem's opaque `sha256` symbol is a definition; the abstract sha256 does not equal any specific hash function.",
      "severity": "HIGH",
      "violation_impact": "Digest-value and proof-verification claims fail if SHA-256 behavior differs from the abstract oracle.",
      "validation": "Pin the FFI/precompile interface and run known-answer vectors; do not promote vectors to a cryptographic proof.",
      "removal_path": "Prove or import a separately certified SHA-256/precompile refinement theorem \u2014 one that changes the ENUNCE of the registered SSZ parent, not a wrapper that ignores an unused `Sha256Faithful` premise."
    },
    {
      "id": "A-CONSOLIDATION-GATEWAY-NONZERO",
      "accepted": true,
      "risk": "The vault-level theorem assumes that an authorized vault call carries nonzero msg.value. Thomas's 2026-09-13 mandate reformulates this as follows: **the premise is violable on-chain at fee = 0**. When the EIP-7251 consolidation-request predeploy returns `fee = 0` (the STATICCALL is well-defined at `WithdrawalVaultEIP7685.sol:79-93`, so a zero return is representable), the gateway forwards `totalFee = n * fee = 0` to the vault, `msg.value = 0` passes `_requireExactFee(0)`, and the vault commits a zero-value batch. The parent's positive-fee conjunct does not hold on that on-chain path. Therefore this assumption is NOT a claim about outer gateway payment positivity \u2014 it is a **caller-supplied constraint that fee is nonzero on the read path**. The Bus theorem `executeConsolidation_committed_forwards_msgValue` (`audit/trio/consolidation/Bus.lean:203`, PR #263) shows the Bus forwards the executor-supplied `msgValue` unchanged on the committed path, but that `msgValue` itself is a free parameter \u2014 this does not by itself derive fee positivity. Reclassed, not discharged.",
      "justification": "Preferred derivation (Thomas 2026-09-13): `fee \u2260 0 \u2192 totalFee = n * fee \u2260 0` for any `n \u2265 1`. That derivation is pure arithmetic on `WithdrawalVaultEIP7685.sol:66` and the loop at 68-72; it turns the caller-supplied nonzero-`msg.value` premise into a nonzero-`fee` premise on the STATICCALL return at 79-93. The `fee = 0` case is explicitly documented as an on-chain path the premise does not cover.",
      "severity": "MEDIUM",
      "violation_impact": "Without this premise, the modeled vault can accept a nonempty zero-fee batch with zero forwarded value. The positive-fee conclusion does not apply. The `fee = 0` on-chain path (EIP-7251 predeploy returning 0) is representable and admits committed zero-value runs.",
      "validation": "Check the value forwarded by `ConsolidationGateway.addConsolidationRequests` at the pinned lines 212-222 (`totalFee = n * fee` per iteration) and the STATICCALL that reads `fee` from the EIP-7251 predeploy at `WithdrawalVaultEIP7685.sol:79-93` (`_getConsolidationRequestFee` \u2192 `_getFeeFromContract`, error cases `FeeReadFailed` at 87 and `FeeInvalidData` at 91). An ABI bridge alone does not derive fee positivity; the caller must justify the STATICCALL return being nonzero.",
      "removal_path": "RETIRED from all consumer guarantees' assumption lists via PRs #699 (P-CONSOLIDATION-1) and #712 (P-CONSOLIDATION-VALUE-1): the registered abstract parents now consume `PredeployStaticcallResult`-shaped pinned-source premises (naming the EIP-7251 CONSOLIDATION_REQUEST STATICCALL return) and derive `hGatewayAdmittedNonzero` via `gatewayTotalFee_ne_zero_of_fee_ne_zero` (arithmetic bridge in `LidoSRv3/Audit/Source/ConsolidationFeeStaticcallSource.lean`). Assumption entry retained here for historical reference and to name the residual `hFeeNonzero : result.abiDecodedFee ≠ 0` caller-supplied premise on the outer STATICCALL structure — retiring the residual requires a live-STATICCALL executable model on the pinned EIP-7251 predeploy `0x0000BBdDc7CE488642fb579F8B00f3a590007251` (multi-session Verity model work), or a theorem revision accepting the `fee = 0` on-chain path. The `fee = 0` case is documented by `gatewayTotalFee_zero_at_fee_zero` (source plane, `ConsolidationFeeStaticcallSource.lean`). PR #263 provided the Bus forwarding lemma."
    },
    {
      "id": "A-ABSTRACT-TX",
      "accepted": true,
      "risk": "Common success/revert semantics are abstract and are not executable EVM trace semantics. The `LidoSRv3.Audit.TxObservation` model has `.reverted \u21a6 before` and `.committedTrace = \u27e8[], [], []\u27e9` by definition; the isolation attempted by PR #393/#401 (SszSha256Isolation-style orphelinat) is unsound per the corrected mandate 2026-09-12 rule: an assumption embedded in a type/definition remains an assumption even when `#print axioms` does not see it.",

    {
      "id": "A-SOLC-TRUSTED",
      "accepted": true,
      "risk": "Applies to every guarantee: pinned solc compilation is trusted when producing bytecode; the project does not prove solc correct.",
      "justification": "General Yul/EVM correspondence is outside the assurance objective; a pinned compiler is an explicit engineering boundary.",
      "severity": "MEDIUM",
      "scope": "global",
      "violation_impact": "A solc miscompilation could break properties of the generated artifact despite correct Lean/Verity proofs.",
      "validation": "Pin the solc version/profile and retain reproducible artifact hashes when bytecode is produced.",

[profile.default]
src = "src"
test = "."
out = "/tmp/lido-ssz-state-reference-forge-out"
cache_path = "/tmp/lido-ssz-state-reference-forge-cache"
allow_paths = ["../../../solidity", "../../../lido-core"]
remappings = ["pinned-lido/=../../../lido-core/", "contracts/=../../../lido-core/contracts/"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

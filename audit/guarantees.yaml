hrough the recursive dispatcher. The premises are exactly the abstract parent's non-revert conditions plus the model's fuel bound, and each is load-bearing: premise-necessity kill-lines refute the premise-dropped projections on the honest wiring (zero-value (0,2,0), underfunded (10,4,3), fuel (30,29,1) witnesses), and four wiring mutants (dropped refund leg, misrouted vault leg, corrupted refund amount, single request per batch) refute the same universal predicate at the premise-satisfying witness (10,2,3). The five numeral witnesses, rejecting-predeploy rollback, underfunded revert, ETH conservation, and dispatch/multicall replay agreement are retained as auxiliary regression evidence (verity_tx_composes_value_flow_and_rollback). Wave 6 closes the quantifier gap on the other side of the guard: verity_tx_universal_revert_partition proves UniversalRevertPartition, four ∀-quantified rollback arms read through observe (hence through finalWorld, so each arm asserts transaction-entry rollback of the whole balance sheet, not merely a control tag) — msgValue=0 reverts at the gateway after 2 hops for all word-sized (batchSize, feePerRequest); 2^256 ≤ batchSize*feePerRequest reverts at the gateway for all nonzero-valued word-sized inputs with 0 < batchSize; msgValue < batchSize*feePerRequest (non-wrapping) reverts at the gateway; and a funded non-wrapping batch with 29 ≤ batchSize needing more than fuelBudget frames exhausts dispatch at fuelBudget hops with the sender's whole msgValue restored. That partition is conjoined into the registered verity_tx_success_and_revert_partition alongside the four numeral witnesses it subsumes, so the registered claim is strictly strengthened and no prior witness is dropped. verity_tx_universal_zero_remainder_boundary covers the batchSize+3 = fuelBudget zero-remainder corner excluded by the success parent's conservative batchSize+4 ≤ fuelBudget premise, so together the success arm, the boundary corner, and the four revert arms classify ever
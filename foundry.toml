[profile.default]
src = "solidity/src"
test = "solidity/test"
out = "solidity/out"
cache_path = "solidity/cache"
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"


# Runs the pinned library against the actual Lean/Verity executable.
[profile.minfirst_source]
src = "solidity/minfirst/src"
test = "solidity/minfirst/test"
out = "solidity/out/minfirst"
cache_path = "solidity/cache/minfirst"

# Pinned StakingRouter.deposit against DepositNFrameTx via FFI (grok #412).
[profile.deposit_source]
src = "solidity/deposit/src"
test = "solidity/deposit/test"
out = "solidity/out/deposit"
cache_path = "solidity/cache/deposit"
remappings = [
  "contracts/=lido-core/contracts/",
  "@openzeppelin/contracts-v5.2/=audit/deposit-dsm-call/solidity/src/@openzeppelin/contracts-v5.2/"
]

# Pinned TopUpGateway._evaluateTopUpLimit / topUp vs sourceRun via FFI (grok #417).
[profile.topup2_source]
src = "solidity/topup2/src"
test = "solidity/topup2/test"
out = "solidity/out/topup2"
cache_path = "solidity/cache/topup2"
remappings = [
  "contracts/=lido-core/contracts/",
  "@openzeppelin/contracts-v5.2/=audit/deposit-dsm-call/solidity/src/@openzeppelin/contracts-v5.2/"
]

# Pinned Lido.withdrawDepositableEther vs modelWithdrawDepositableEther via FFI (grok #419).
# The 0.4.24 Lido pin is compiled by scripts/test_reserve_source_differential.sh
# (Foundry 1.8 does not resolve solc 0.4.24); the test deploys that bytecode.
[profile.reserve_source]
src = "solidity/reserve/src"
test = "solidity/reserve/test"
out = "solidity/out/reserve"
cache_path = "solidity/cache/reserve"
solc_version = "0.8.25"
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "contracts/=lido-core/contracts/"
]

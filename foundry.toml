[profile.default]
src = "solidity/src"
test = "solidity/test"
out = "solidity/out"
cache_path = "solidity/cache"
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"


# Runs the pinned library against the actual Lean/Verity executable.
[profile.minfirst_source]
src = "solidity/minfirst/src"
test = "solidity/minfirst/test"
out = "solidity/out/minfirst"
cache_path = "solidity/cache/minfirst"

# Pinned TopUpGateway._evaluateTopUpLimit / topUp vs sourceRun via FFI.
[profile.topup2_source]
src = "solidity/topup2/src"
test = "solidity/topup2/test"
out = "solidity/out/topup2"
cache_path = "solidity/cache/topup2"
remappings = [
  "contracts/=lido-core/contracts/",
  "@openzeppelin/contracts-v5.2/=audit/deposit-dsm-call/solidity/src/@openzeppelin/contracts-v5.2/"
]

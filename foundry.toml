[profile.default]
src = "solidity/src"
test = "solidity/test"
out = "solidity/out"
cache_path = "solidity/cache"
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"


# Runs the pinned library against the actual Lean/Verity executable.
[profile.minfirst_source]
src = "solidity/minfirst/src"
test = "solidity/minfirst/test"
out = "solidity/out/minfirst"
cache_path = "solidity/cache/minfirst"

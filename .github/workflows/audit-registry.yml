name: Audit registry

on:
  pull_request:
  push:
    branches: [main, "audit/**"]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@v1
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA"..HEAD
      - name: Validate registry, artifacts, generated views, and negative fixtures
        run: make audit-check audit-check-lean
